<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrecisionCalc PRO‑X | Professional Scientific Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="calculator on" id="calculator">
        <div class="power-indicator" id="powerIndicator"></div>

        <div class="brand-bar">
            <span class="brand-name">PrecisionCalc</span>
            <span class="brand-model">PRO‑X</span>
        </div>

        <div class="screen-assembly">
            <div class="screen-anti-glare">
                <div class="annunciators" id="annunciators">
                    <span id="annShiftG">SHIFT G</span>
                    <span id="annShiftB">SHIFT B</span>
                    <span id="annAngle">DEG</span>
                    <span id="annRPN">RPN</span>
                    <span id="annMEM">MEM</span>
                </div>
                <div class="display" id="display">0</div>
                <div class="stack-preview" id="stackPreview"></div>
            </div>
        </div>

        <div class="keypad" id="keypad">
            <!-- Row 1 -->
            <button class="key key-shift-gold" data-action="shiftG">G</button>
            <button class="key key-shift-blue" data-action="shiftB">B</button>
            <button class="key key-func" data-action="clear">CLR</button>
            <button class="key key-func" data-action="backspace">⌫</button>
            <button class="key key-operator" data-action="divide">÷</button>

            <!-- Row 2 -->
            <button class="key key-func has-shift-gold has-shift-blue"
                    data-shift-gold="√" data-shift-blue="x!"
                    data-action="square">x²</button>
            <button class="key key-func has-shift-gold has-shift-blue"
                    data-shift-gold="ln" data-shift-blue="10ˣ"
                    data-action="log">log</button>
            <button class="key key-func has-shift-gold has-shift-blue"
                    data-shift-gold="ˣ√y" data-shift-blue="1/x"
                    data-action="power">xʸ</button>
            <button class="key key-func has-shift-blue"
                    data-shift-blue="10ˣ"
                    data-action="exp">eˣ</button>
            <button class="key key-operator" data-action="multiply">×</button>

            <!-- Row 3 -->
            <button class="key key-func has-shift-gold"
                    data-shift-gold="ASIN"
                    data-action="sin">sin</button>
            <button class="key key-func has-shift-gold"
                    data-shift-gold="ACOS"
                    data-action="cos">cos</button>
            <button class="key key-func has-shift-gold"
                    data-shift-gold="ATAN"
                    data-action="tan">tan</button>
            <button class="key key-func has-shift-gold has-shift-blue"
                    data-shift-gold="π" data-shift-blue="FACT"
                    data-action="pi">π</button>
            <button class="key key-operator" data-action="subtract">−</button>

            <!-- Row 4 -->
            <button class="key key-number" data-action="digit" data-value="7">7</button>
            <button class="key key-number" data-action="digit" data-value="8">8</button>
            <button class="key key-number" data-action="digit" data-value="9">9</button>
            <button class="key key-func has-shift-gold"
                    data-shift-gold="STO"
                    data-action="store">STO</button>
            <button class="key key-operator" data-action="add">+</button>

            <!-- Row 5 -->
            <button class="key key-number" data-action="digit" data-value="4">4</button>
            <button class="key key-number" data-action="digit" data-value="5">5</button>
            <button class="key key-number" data-action="digit" data-value="6">6</button>
            <button class="key key-func has-shift-gold"
                    data-shift-gold="RCL"
                    data-action="recall">RCL</button>
            <button class="key key-operator key-wide"
                    data-action="equals" style="grid-row: span 2;">=</button>

            <!-- Row 6 -->
            <button class="key key-number" data-action="digit" data-value="1">1</button>
            <button class="key key-number" data-action="digit" data-value="2">2</button>
            <button class="key key-number" data-action="digit" data-value="3">3</button>
            <button class="key key-func" data-action="negate">+/−</button>

            <!-- Row 7 -->
            <button class="key key-number key-wide"
                    data-action="digit" data-value="0">0</button>
            <button class="key key-number" data-action="decimal">.</button>
            <button class="key key-func" data-action="enter" style="font-weight:700;">ENT</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
